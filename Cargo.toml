[package]
name = "rusty-docs"
version = "0.1.0"
edition = "2024"
description = "Generate static documentation sites for Rust crates"
license = "MIT"
repository = "https://github.com/malezjaa/rusty-docs"
keywords = ["documentation", "rustdoc", "static-site", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["color", "derive"] }
dialoguer = "0.12"
include_dir = "0.7"
indicatif = "0.18"
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
yansi = "1.0.1"
